spring:
  application:
    name: hmc-be

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hmc}
    username: ${DB_USERNAME:hmc}
    password: ${DB_PASSWORD:hmc}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

app:
  cors:
    # 브라우저에서 호출하는 프론트엔드 출처(쉼표 구분). 비어 있으면 교차 출처 요청을 모두 거부한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

logging:
  loki:
    url: ${LOKI_URL:}
