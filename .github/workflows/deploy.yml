name: Deploy
on:
  push:
    branches: [develop]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [develop]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy-prod' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/

  # Current AWS account cannot trust GitHub (SCP blocks OIDC and IAM-user keys), so CI only
  # publishes the image; the EC2 hmc-autodeploy timer pulls the `develop` tag. docs/DEPLOYMENT.md
  publish:
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hyundai-develop-app/hmc-be
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Pushed ${IMAGE}@${{ steps.image.outputs.digest }}; EC2 autodeploy picks it up within ~1 minute." >> "$GITHUB_STEP_SUMMARY"

  # Legacy path for accounts that allow GitHub OIDC (Terraform enable_github_oidc_deploy=true).
  deploy:
    needs: test
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy through SSM and verify result
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, shlex
          compose = base64.b64encode(pathlib.Path("docker-compose.prod.yml").read_bytes()).decode()
          script = base64.b64encode(pathlib.Path("scripts/deploy-ec2.sh").read_bytes()).decode()
          image = os.environ["ECR_REPOSITORY"] + "@" + os.environ["IMAGE_DIGEST"]
          command = (
              "set -eu\ncd /opt/hmc\ntest -s .env\n"
              f"echo {compose} | base64 -d > docker-compose.yml\n"
              f"echo {script} | base64 -d > deploy.sh\n"
              f"bash deploy.sh {shlex.quote(image)} {shlex.quote(os.environ['AWS_REGION'])}\n"
          )
          pathlib.Path("/tmp/ssm.json").write_text(json.dumps({"commands": [command], "executionTimeout": ["900"]}))
          PY
          command_id=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript --parameters file:///tmp/ssm.json --query Command.CommandId --output text)
          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
                exit 1 ;;
            esac
            sleep 5
          done
          echo "SSM deployment timed out"
          exit 1
